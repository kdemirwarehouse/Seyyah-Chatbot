<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Seyyah-AI | Gezi Asistanı</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <h2>
        <img src="/static/images/seyyah.png" alt="Seyyah-AI Logo" class="header-icon" />
        Seyyah-AI
      </h2>
      <div class="new-chat" id="new-chat-btn">
        <span class="new-chat-icon">＋</span> Yeni Sohbet
      </div>
      <ul id="chat-history"></ul>
    </aside>
 
    <main class="chat-area">
      <div class="response" id="response-area">
        <!-- Placeholder içeriği JavaScript ile doldurulacak -->
      </div>
      
      <form id="chat-form" class="chat-form">
        <input type="text" id="user-input" placeholder="Örn: Elazığ'ın tarihi nedir? veya İstanbul'da ne yenir?" autocomplete="off" required />
        <button type="submit">
          <img src="https://cdn-icons-png.flaticon.com/512/724/724715.png" alt="Gönder" class="send-icon" />
        </button>
      </form>
    </main>
  </div>
  
  <div id="config" data-logo-url="/static/images/seyyah.png"></div>
  
  <script src="/static/js/script.js"></script>
</body>
</html>
